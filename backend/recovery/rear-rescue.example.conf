# QA-certified topology only: 1 Btrfs root, 1 FAT32 ESP, GRUB, no Secure Boot.
# Never activate without verifying paths and backups. Do not use for LUKS/RAID.
HARBOR_REAR_PROFILE=single-root-uefi-grub-v1
HARBOR_REAR_REPO=/path/to/verified/cas-repository
HARBOR_REAR_ARCHIVE=whole-root
HARBOR_REAR_SNAPSHOT=verified-read-only-root-snapshot
HARBOR_REAR_ESP_ARCHIVE=/path/to/esp-root-backup.tar.gz
HARBOR_REAR_ESP_SHA256=/path/to/esp-checksum.txt
HARBOR_REAR_GRUB_ID=debian
