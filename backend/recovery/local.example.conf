# ReaR 2.9+ configuration template; not automatically activated.
OUTPUT=ISO
BACKUP=EXTERNAL
EXTERNAL_BACKUP='/bin/true'
EXTERNAL_RESTORE='/usr/lib/btrfs-harbor/recovery/harbor-rear-restore'
ISO_DEFAULT=automatic
REQUIRED_PROGS+=( btrfs cp tar sha256sum findmnt od tr awk wc find stat mountpoint mount chroot )
COPY_AS_IS+=( /usr/lib/btrfs-harbor/recovery/harbor-rear-restore /usr/bin/harbor-transport /etc/btrfs-harbor/rear-rescue.conf )
