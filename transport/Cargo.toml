[package]
name = "harbor-transport"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Experimental content-addressed resilient Btrfs send transport for Btrfs Assistant Harbor"

[dependencies]
anyhow = "1"
fastcdc = "=5.0.0"
blake3 = "1.8"
sha2 = "0.10"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
libc = "0.2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
