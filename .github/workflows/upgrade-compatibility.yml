name: Harbor package upgrade and rollback QA (manual)
on:
  workflow_dispatch:
    inputs:
      candidate_debian_run:
        description: Completed successful Harbor certification run ID (Debian 13 artifact)
        required: true
        type: string
      candidate_native_run:
        description: Completed successful native packages run ID (Fedora 44 + Arch artifacts)
        required: true
        type: string
      baseline_debian_run:
        description: Known-good historical Debian 13 QA run ID
        required: true
        default: "39654023427"
        type: string
      baseline_native_run:
        description: Known-good historical Fedora 44 and Arch QA run ID
        required: true
        default: "39654023512"
        type: string
permissions:
  contents: read
  actions: read
jobs:
  debian13:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.baseline_debian_run }}
          name: harbor-debian13-QA-candidate
          path: baseline
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_debian_run }}
          name: harbor-debian13-QA-candidate
          path: candidate
      - name: Verify provenance hashes then old→new→old→new→purge
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && sha256sum -c SHA256SUMS)
          (cd candidate && sha256sum -c SHA256SUMS)
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./baseline/*.deb
          old="$(dpkg-query -W -f='${Version}' btrfs-assistant-harbor)"
          new="$(dpkg-deb -f candidate/*.deb Version)"
          dpkg --compare-versions "$new" gt "$old"
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./candidate/*.deb
          test "$(dpkg-query -W -f='${Version}' btrfs-assistant-harbor)" = "$new"
          test -x /usr/bin/harbor-transport
          DEBIAN_FRONTEND=noninteractive apt-get install -y --allow-downgrades --no-install-recommends ./baseline/*.deb
          test "$(dpkg-query -W -f='${Version}' btrfs-assistant-harbor)" = "$old"
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./candidate/*.deb
          test "$(dpkg-query -W -f='${Version}' btrfs-assistant-harbor)" = "$new"
          apt-get purge -y btrfs-assistant-harbor
          echo "PASS_DEBIAN13_UPGRADE_DOWNGRADE old=$old new=$new"

  fedora44:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.baseline_native_run }}
          name: harbor-fedora44-rpm-QA
          path: baseline
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_native_run }}
          name: harbor-fedora44-rpm-QA
          path: candidate
      - name: Verify SHA then native RPM upgrade and downgrade
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && sha256sum -c SHA256SUMS)
          (cd candidate && sha256sum -c SHA256SUMS)
          dnf install -y --setopt=install_weak_deps=False ./baseline/*.rpm
          old="$(rpm -q --qf '%{VERSION}-%{RELEASE}' btrfs-assistant-harbor)"
          new="$(rpm -qp --qf '%{VERSION}-%{RELEASE}' candidate/*.rpm)"
          test "$old" != "$new"
          dnf upgrade -y ./candidate/*.rpm
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}' btrfs-assistant-harbor)" = "$new"
          test -x /usr/bin/harbor-transport
          dnf downgrade -y ./baseline/*.rpm
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}' btrfs-assistant-harbor)" = "$old"
          dnf upgrade -y ./candidate/*.rpm
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}' btrfs-assistant-harbor)" = "$new"
          dnf remove -y btrfs-assistant-harbor
          echo "PASS_FEDORA44_RPM_UPGRADE_DOWNGRADE old=$old new=$new"

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.baseline_native_run }}
          name: harbor-arch-pkg-QA
          path: baseline
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_native_run }}
          name: harbor-arch-pkg-QA
          path: candidate
      - name: Verify checksums and native pacman package upgrade + rollback
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && sha256sum -c SHA256SUMS)
          (cd candidate && sha256sum -c SHA256SUMS)
          pacman -Syu --noconfirm --needed ca-certificates
          pacman -U --noconfirm ./baseline/*.pkg.tar.zst
          old="$(pacman -Q btrfs-assistant-harbor | awk '{print $2}')"
          pacman -U --noconfirm ./candidate/*.pkg.tar.zst
          new="$(pacman -Q btrfs-assistant-harbor | awk '{print $2}')"
          test "$old" != "$new"
          test -x /usr/bin/harbor-transport
          pacman -U --noconfirm ./baseline/*.pkg.tar.zst
          test "$(pacman -Q btrfs-assistant-harbor | awk '{print $2}')" = "$old"
          pacman -U --noconfirm ./candidate/*.pkg.tar.zst
          test "$(pacman -Q btrfs-assistant-harbor | awk '{print $2}')" = "$new"
          pacman -R --noconfirm btrfs-assistant-harbor
          echo "PASS_ARCH_PACKAGE_UPGRADE_DOWNGRADE old=$old new=$new"
