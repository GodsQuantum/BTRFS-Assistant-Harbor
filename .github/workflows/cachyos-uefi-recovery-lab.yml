name: CachyOS UEFI recovery lab (explicit / isolated)

on:
  push:
    branches:
      - feat/whole-computer-recovery-20261023
    paths:
      - .github/workflows/cachyos-uefi-recovery-lab.yml
      - tests/qa_cachyos_iso_inventory.py
      - tests/qa_cachyos_uefi_boot_from_iso.sh
      - tests/qa_cachyos_uefi_guest_expect.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-iso-intake:
    name: Verify real CachyOS install media and inspect boot assets
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v4

      - name: Reserve disposable disk space
        run: |
          set -euo pipefail
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache
          df -h .

      - name: Install offline UEFI and installation inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf qemu-utils p7zip-full squashfs-tools \
            libarchive-tools cryptsetup dosfstools btrfs-progs

      - name: Acquire official CachyOS 260809 ISO and verify published SHA-256
        env:
          ISO_URL: https://iso.cachyos.org/desktop/260809/cachyos-desktop-linux-260809.iso
        run: |
          set -euo pipefail
          mkdir -p /tmp/harbor-uefi-lab
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 25 \
            --max-time 1600 "$ISO_URL" \
            -o /tmp/harbor-uefi-lab/cachyos.iso
          echo "959f6577f45e25ee9fd8c220fd221b08e4ea79412c7315c0f922dd6d86d5e33c  /tmp/harbor-uefi-lab/cachyos.iso" |
            sha256sum --check --
          echo PASS_OFFICIAL_CACHYOS_ISO_SHA256_VERIFIED

      - name: Record exact installer kernel/initramfs and rootfs members
        run: |
          set -euo pipefail
          7z l -slt /tmp/harbor-uefi-lab/cachyos.iso > /tmp/harbor-uefi-lab/iso-members.txt
          python3 tests/qa_cachyos_iso_inventory.py \
            /tmp/harbor-uefi-lab/iso-members.txt \
            /tmp/harbor-uefi-lab/iso-inventory.json
          ls -l /usr/share/OVMF/OVMF_CODE*.fd
          cat /tmp/harbor-uefi-lab/iso-inventory.json
          echo PASS_REAL_CACHYOS_INSTALL_MEDIA_AND_UEFI_ASSET_INVENTORY

      - name: Boot restored CachyOS root in real isolated UEFI QEMU / LUKS2 / Limine
        timeout-minutes: 35
        run: |
          sudo apt-get install -y --no-install-recommends gdisk python3-pexpect
          sudo env GITHUB_ACTIONS=true bash tests/qa_cachyos_uefi_boot_from_iso.sh             /tmp/harbor-uefi-lab/cachyos.iso

      - name: Preserve machine-readable ISO inventory as certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cachyos-uefi-260809-inventory
          path: |
            /tmp/harbor-uefi-lab/iso-inventory.json
            /tmp/harbor-uefi-lab/guest-serial.log
            /tmp/harbor-uefi-lab/mkinitcpio.log
          if-no-files-found: warn
          retention-days: 3
