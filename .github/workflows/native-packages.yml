name: Native packages (Fedora and Arch)
on:
  push:
    branches: [main, 'cert/**', 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fedora44-rpm:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native Fedora 44 build requirements
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qttools-devel \
            rust cargo pkgconf-pkg-config libzstd-devel btrfs-progs-devel \
            btrfs-progs snapper polkit python3 python3-filelock python3-rich \
            rpm-build tar gzip git which make
          rpm --version
          rustc --version
          pkg-config --modversion Qt6Core
      - name: RPM build and native tests
        env:
          ZSTD_SYS_USE_PKG_CONFIG: "1"
          CARGO_BUILD_JOBS: "3"
          QT_QPA_PLATFORM: "offscreen"
        run: |
          mkdir -p "$RUNNER_TEMP/rpmbuild/"{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          # Checkout can use the REST source archive in slim containers without
          # Git installed at checkout time. Never require .git in package jobs.
          test -f "$GITHUB_WORKSPACE/CMakeLists.txt"
          tar -C "$GITHUB_WORKSPACE" --exclude=.git --exclude=build \
            --transform='s|^\./|btrfs-assistant-harbor/|' \
            -czf "$RUNNER_TEMP/rpmbuild/SOURCES/btrfs-assistant-harbor-1.0.0.tar.gz" .
          cp packaging/fedora/btrfs-assistant-harbor.spec "$RUNNER_TEMP/rpmbuild/SPECS/"
          rpmbuild --define "_topdir $RUNNER_TEMP/rpmbuild" \
            -ba "$RUNNER_TEMP/rpmbuild/SPECS/btrfs-assistant-harbor.spec"
          mkdir -p dist/fedora44
          cp "$RUNNER_TEMP"/rpmbuild/RPMS/x86_64/*.rpm dist/fedora44/
          (cd dist/fedora44 && sha256sum *.rpm > SHA256SUMS)
      - name: Fedora 44 native RPM install-remove-reinstall
        run: |
          dnf install -y --setopt=install_weak_deps=False ./dist/fedora44/*.rpm
          rpm -q btrfs-assistant-harbor
          test -x /usr/bin/harbor-transport
          test -x /usr/bin/btrfs-assistant-harbor-job
          /usr/bin/btrfs-assistant-harbor-job --help >/dev/null
          test -f /usr/lib/systemd/system/btrfs-assistant-harbor-job@.service
          test ! -d /etc/systemd/system/multi-user.target.wants/btrfs-assistant-harbor-job@.service
          /usr/bin/btrfs-assistant-harbor-bin --version
          dnf remove -y btrfs-assistant-harbor
          if rpm -q btrfs-assistant-harbor; then exit 31; fi
          dnf install -y --setopt=install_weak_deps=False ./dist/fedora44/*.rpm
          test -x /usr/bin/harbor-transport
          rpm -e btrfs-assistant-harbor
          if rpm -q btrfs-assistant-harbor; then exit 32; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: startsWith(github.ref, 'refs/heads/cert/')
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39699791484
          name: harbor-fedora44-rpm-QA
          path: dist/fedora44-baseline
      - name: Fedora native RPM cross-version upgrade/rollback
        if: startsWith(github.ref, 'refs/heads/cert/')
        shell: bash
        run: |
          set -euo pipefail
          (cd dist/fedora44-baseline && sha256sum -c SHA256SUMS)
          (cd dist/fedora44 && sha256sum -c SHA256SUMS)
          dnf install -y ./dist/fedora44-baseline/btrfs-assistant-harbor-[0-9]*.rpm
          old="$(rpm -q --qf '%{VERSION}-%{RELEASE}' btrfs-assistant-harbor)"
          new="$(rpm -qp --qf '%{VERSION}-%{RELEASE}' dist/fedora44/btrfs-assistant-harbor-[0-9]*.rpm)"
          test "$old" != "$new"
          dnf upgrade -y ./dist/fedora44/btrfs-assistant-harbor-[0-9]*.rpm
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}' btrfs-assistant-harbor)" = "$new"
          dnf downgrade -y ./dist/fedora44-baseline/btrfs-assistant-harbor-[0-9]*.rpm
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}' btrfs-assistant-harbor)" = "$old"
          dnf upgrade -y ./dist/fedora44/btrfs-assistant-harbor-[0-9]*.rpm
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}' btrfs-assistant-harbor)" = "$new"
          test -x /usr/bin/harbor-transport
          dnf remove -y btrfs-assistant-harbor
          echo "PASS_FEDORA44_CROSS_VERSION old=$old new=$new"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harbor-fedora44-rpm-QA
          path: dist/fedora44/
          if-no-files-found: error
          retention-days: 14

  arch-pkg:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Arch build requirements
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja qt6-base qt6-tools qt6-declarative \
            rust cargo pkgconf btrfs-progs snapper polkit \
            python python-filelock python-rich zstd git tar gzip
          rustc --version
          pkg-config --modversion Qt6Core
      - name: Makepkg, test and SHA256
        env:
          QT_QPA_PLATFORM: "offscreen"
          ZSTD_SYS_USE_PKG_CONFIG: "1"
          CARGO_BUILD_JOBS: "3"
        run: |
          mkdir -p "$RUNNER_TEMP/arch-build/btrfs-assistant-harbor"
          test -f "$GITHUB_WORKSPACE/CMakeLists.txt"
          tar -C "$GITHUB_WORKSPACE" --exclude=.git --exclude=build -cf - . \
            | tar -xf - -C "$RUNNER_TEMP/arch-build/btrfs-assistant-harbor"
          tar -czf "$RUNNER_TEMP/arch-build/btrfs-assistant-harbor-1.0.0.tar.gz" \
            -C "$RUNNER_TEMP/arch-build" btrfs-assistant-harbor
          SOURCE_SHA="$(sha256sum "$RUNNER_TEMP/arch-build/btrfs-assistant-harbor-1.0.0.tar.gz" | cut -d' ' -f1)"
          sed "s/@SHA256@/$SOURCE_SHA/g" packaging/arch/PKGBUILD.in > "$RUNNER_TEMP/arch-build/PKGBUILD"
          cp packaging/arch/btrfs-assistant-harbor.install "$RUNNER_TEMP/arch-build/btrfs-assistant-harbor.install"
          useradd -m -s /bin/bash harbor-builder
          chown -R harbor-builder:harbor-builder "$RUNNER_TEMP/arch-build"
          runuser -u harbor-builder -- bash -lc "cd '$RUNNER_TEMP/arch-build' && makepkg --noconfirm --cleanbuild"
          mkdir -p dist/arch
          cp "$RUNNER_TEMP"/arch-build/*.pkg.tar.zst dist/arch/
          (cd dist/arch && sha256sum *.pkg.tar.zst > SHA256SUMS)
      - name: Arch native package install-remove-reinstall
        run: |
          pacman -U --noconfirm ./dist/arch/*.pkg.tar.zst
          pacman -Q btrfs-assistant-harbor
          test -x /usr/bin/harbor-transport
          test -x /usr/bin/btrfs-assistant-harbor-job
          /usr/bin/btrfs-assistant-harbor-job --help >/dev/null
          test -f /usr/lib/systemd/system/btrfs-assistant-harbor-job@.service
          test ! -d /etc/systemd/system/multi-user.target.wants/btrfs-assistant-harbor-job@.service
          /usr/bin/btrfs-assistant-harbor-bin --version
          pacman -R --noconfirm btrfs-assistant-harbor
          if pacman -Q btrfs-assistant-harbor; then exit 31; fi
          pacman -U --noconfirm ./dist/arch/*.pkg.tar.zst
          test -x /usr/bin/harbor-transport
          pacman -R --noconfirm btrfs-assistant-harbor
          if pacman -Q btrfs-assistant-harbor; then exit 32; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: startsWith(github.ref, 'refs/heads/cert/')
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39699791484
          name: harbor-arch-pkg-QA
          path: dist/arch-baseline
      - name: Arch native cross-version pacman upgrade and rollback
        if: startsWith(github.ref, 'refs/heads/cert/')
        shell: bash
        run: |
          set -euo pipefail
          (cd dist/arch-baseline && sha256sum -c SHA256SUMS)
          (cd dist/arch && sha256sum -c SHA256SUMS)
          pacman -U --noconfirm ./dist/arch-baseline/*.pkg.tar.zst
          old="$(pacman -Q btrfs-assistant-harbor | awk '{print $2}')"
          pacman -U --noconfirm ./dist/arch/*.pkg.tar.zst
          new="$(pacman -Q btrfs-assistant-harbor | awk '{print $2}')"
          test "$old" != "$new"
          test -x /usr/bin/harbor-transport
          pacman -U --noconfirm ./dist/arch-baseline/*.pkg.tar.zst
          test "$(pacman -Q btrfs-assistant-harbor | awk '{print $2}')" = "$old"
          pacman -U --noconfirm ./dist/arch/*.pkg.tar.zst
          test "$(pacman -Q btrfs-assistant-harbor | awk '{print $2}')" = "$new"
          pacman -R --noconfirm btrfs-assistant-harbor
          echo "PASS_ARCH_CROSS_VERSION old=$old new=$new"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harbor-arch-pkg-QA
          path: dist/arch/
          if-no-files-found: error
          retention-days: 14

  fedora44-kwin6:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native Fedora 44 KWin6 Qt compositor + test toolchain
        run: |
          # KWin does not require Cisco's external H.264 RPM. The Cisco
          # mirror timed out and failed the otherwise-complete QA install.
          dnf --disablerepo=fedora-cisco-openh264 install -y --setopt=install_weak_deps=False \
            cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qttools-devel \
            libzstd-devel btrfs-progs-devel python3 btrfs-progs snapper \
            rust cargo pkgconf-pkg-config \
            kwin qt6-qtwayland dbus-daemon libcap mesa-dri-drivers \
            mesa-libEGL mesa-libGL shadow-utils
          command -v kwin_wayland
          kwin_wayland --version || true
          getcap /usr/bin/kwin_wayland || true
          setcap -r /usr/bin/kwin_wayland 2>/dev/null || true
      - name: Test Harbor Qt under genuine KWin6 Wayland session
        env:
          ZSTD_SYS_USE_PKG_CONFIG: "1"
          CARGO_BUILD_JOBS: "3"
        run: |
          cmake -S . -B build/kwin6 -G Ninja -DCMAKE_BUILD_TYPE=Release
          # The test loads FR/ZH compiled .qm catalogs; building the test
          # executable alone does not run the independent translation target.
          cmake --build build/kwin6 --parallel 3 \
            --target btrfs-assistant-harbor_lrelease test-harbor-gui-user-smoke
          useradd -m -s /bin/bash harbor-kwin-qa
          # CTest writes Testing/Temporary; grant access only to this QA
          # output directory, not to the source tree or installed packages.
          install -d -m 0755 -o harbor-kwin-qa -g harbor-kwin-qa build/kwin6/Testing
          runuser -u harbor-kwin-qa -- bash -c 'cd "$1"; bash tests/qa_kwin_wayland_smoke.sh build/kwin6' bash "$GITHUB_WORKSPACE"
