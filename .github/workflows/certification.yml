name: Harbor certification CI
on:
  push:
    branches: [main, 'cert/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: harbor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust lint, tests and portable binary
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native Rust and static musl prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools pkg-config libzstd-dev
          rustup target add x86_64-unknown-linux-musl
      - name: Rust formatting, tests and Clippy
        working-directory: transport
        run: |
          cargo fmt --all --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: Produce static transport
        working-directory: transport
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/harbor-transport
          sha256sum target/x86_64-unknown-linux-musl/release/harbor-transport
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harbor-transport-static
          path: transport/target/x86_64-unknown-linux-musl/release/harbor-transport
          if-no-files-found: error
          retention-days: 14

  qt-and-python:
    name: Qt/Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native Qt/Snapper build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libbtrfsutil-dev btrfs-progs snapper zstd libzstd-dev python3 python3-filelock python3-rich
      - name: Qt6 build and CTest
        run: |
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build/ci --parallel 4
          QT_QPA_PLATFORM=offscreen ctest --test-dir build/ci --output-on-failure
      - name: Python regression suite
        run: PYTHONPATH=vendor/harbor-legacy:. python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Full French and Chinese Qt remote-backup translation coverage
        run: python3 tests/qa_translation_coverage.py
      - name: Headless real Wayland compositor Qt navigation
        run: |
          sudo apt-get install -y --no-install-recommends weston qt6-wayland
          bash tests/qa_wayland_smoke.sh build/ci
      - name: Real KWin KDE Wayland compositor Qt navigation (Ubuntu 24.04)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            kwin-wayland qtwayland5 dbus-user-session mesa-utils
          # No elevated executable capabilities in the disposable CI sandbox.
          sudo setcap -r /usr/bin/kwin_wayland
          bash tests/qa_kwin_wayland_smoke.sh build/ci
      - name: Qt button cancels a real CAS stream, no partial manifest
        env:
          QT_QPA_PLATFORM: offscreen
          HARBOR_GUI_QA_TRANSPORT: ${{ github.workspace }}/build/ci/harbor-rust/release/harbor-transport
        run: |
          test -x "$HARBOR_GUI_QA_TRANSPORT"
          build/ci/src/test-harbor-gui-user-smoke cancellationDuringRealCasTransferRejectsPartialManifestAndAllowsRetry

  debian13-package:
    name: Native Debian 13 Linux release candidate
    runs-on: ubuntu-24.04
    container: debian:13
    needs: [rust]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Debian 13 Qt/Btrfs toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libbtrfsutil-dev btrfs-progs snapper zstd dpkg-dev python3 python3-filelock python3-rich ca-certificates git
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: harbor-transport-static
          path: prebuilt
      - name: Debian native GUI, CTest, package
        run: |
          cmake -S . -B build/debian13 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCARGO_EXECUTABLE=/usr/bin/true
          cmake --build build/debian13 --parallel 4 --target btrfs-assistant-harbor-bin test-harbor-gui-user-smoke test-remote-backup-plan test-machine-set-protocol
          QT_QPA_PLATFORM=offscreen ctest --test-dir build/debian13 --output-on-failure
          mkdir -p build/debian13/harbor-rust/release
          install -m 0755 prebuilt/harbor-transport build/debian13/harbor-rust/release/harbor-transport
          python3 packaging/debian/build_preview.py --version '0.1.4-1+deb13' --build build/debian13 --out dist/debian13
          dpkg-deb -f dist/debian13/*.deb Package Version Architecture Depends
          (cd dist/debian13 && sha256sum *.deb > SHA256SUMS)
      - name: Debian 13 install, uninstall, reinstall and purge (disposable container)
        run: |
          apt-get install -y --no-install-recommends ./dist/debian13/*.deb
          dpkg-query -W -f='${Status}\n' btrfs-assistant-harbor
          test -x /usr/bin/harbor-transport
          /usr/bin/btrfs-assistant-harbor-bin --version
          apt-get remove -y btrfs-assistant-harbor
          if dpkg-query -W -f='${Status}' btrfs-assistant-harbor 2>/dev/null | grep -q 'install ok installed'; then exit 31; fi
          apt-get install -y --no-install-recommends ./dist/debian13/*.deb
          test -x /usr/bin/harbor-transport
          apt-get purge -y btrfs-assistant-harbor
          if dpkg-query -W -f='${Status}' btrfs-assistant-harbor 2>/dev/null | grep -q 'install ok installed'; then exit 32; fi
      # Baseline artifacts are pinned to an earlier green QA commit. This
      # branch-scoped gate must not silently disappear: expired baselines fail.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: startsWith(github.ref, 'refs/heads/cert/')
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39699791482
          name: harbor-debian13-QA-candidate
          path: dist/debian13-baseline
      - name: Debian cross-version upgrade, downgrade, re-upgrade
        if: startsWith(github.ref, 'refs/heads/cert/')
        shell: bash
        run: |
          set -euo pipefail
          (cd dist/debian13-baseline && sed 's@  dist/debian13/@  @' SHA256SUMS | sha256sum -c -)
          (cd dist/debian13 && sha256sum -c SHA256SUMS)
          apt-get install -y --no-install-recommends ./dist/debian13-baseline/*.deb
          old="$(dpkg-query -W -f='${Version}' btrfs-assistant-harbor)"
          new="$(dpkg-deb -f dist/debian13/*.deb Version)"
          dpkg --compare-versions "$new" gt "$old"
          apt-get install -y --no-install-recommends ./dist/debian13/*.deb
          test "$(dpkg-query -W -f='${Version}' btrfs-assistant-harbor)" = "$new"
          apt-get install -y --allow-downgrades --no-install-recommends ./dist/debian13-baseline/*.deb
          test "$(dpkg-query -W -f='${Version}' btrfs-assistant-harbor)" = "$old"
          apt-get install -y --no-install-recommends ./dist/debian13/*.deb
          test "$(dpkg-query -W -f='${Version}' btrfs-assistant-harbor)" = "$new"
          test -x /usr/bin/harbor-transport
          apt-get purge -y btrfs-assistant-harbor
          echo "PASS_DEBIAN13_CROSS_VERSION old=$old new=$new"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harbor-debian13-QA-candidate
          path: |
            dist/debian13/*.deb
            dist/debian13/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  real-btrfs-gui-loop:
    name: GUI native Btrfs send cancellation and recovery (disposable runner)
    runs-on: ubuntu-24.04
    needs: [rust]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: harbor-transport-static
          path: prebuilt
      - name: Qt and Btrfs native host runner tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config qt6-base-dev qt6-tools-dev \
            qt6-tools-dev-tools libbtrfsutil-dev btrfs-progs snapper python3
      - name: Build true Qt test against the runner's native ABI
        run: |
          cmake -S . -B build/qa-real-btrfs -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCARGO_EXECUTABLE=/usr/bin/true
          cmake --build build/qa-real-btrfs --parallel 4 --target test-harbor-gui-user-smoke
          # GitHub artifact download preserves bytes, not the executable bit.
          file prebuilt/harbor-transport | grep -q ELF
          chmod 0755 prebuilt/harbor-transport
          test -x prebuilt/harbor-transport
      - name: Cancel a real Btrfs send from Qt, retry and byte-compare restoration
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/harbor-btrfs-fixture.img"
          mountpoint="$RUNNER_TEMP/harbor-btrfs-mount"
          truncate -s 4G "$image"
          sudo mkfs.btrfs -f "$image"
          sudo mkdir -p "$mountpoint"
          sudo mount -o loop -t btrfs "$image" "$mountpoint"
          trap 'sudo umount "$mountpoint" || true' EXIT
          sudo btrfs subvolume create "$mountpoint/source"
          sudo dd if=/dev/urandom of="$mountpoint/source/payload.bin" \
            bs=1M count=768 status=none
          sudo btrfs subvolume snapshot -r "$mountpoint/source" "$mountpoint/qa-ro"
          sudo btrfs property get -ts "$mountpoint/qa-ro" ro | grep -q 'ro=true'
          sudo env QT_QPA_PLATFORM=offscreen PKEXEC_UID=0 \
            HARBOR_GUI_QA_TRANSPORT="$GITHUB_WORKSPACE/prebuilt/harbor-transport" \
            HARBOR_GUI_QA_BTRFS_SNAPSHOT="$mountpoint/qa-ro" \
            HARBOR_GUI_QA_BTRFS_STAGING_ROOT="$mountpoint" \
            "$GITHUB_WORKSPACE/build/qa-real-btrfs/src/test-harbor-gui-user-smoke" \
            cancellationDuringRealBtrfsSendPreservesRepository

  snapper-native-btrfs:
    name: Native Snapper create/list/diff/delete with Btrfs loopback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install distribution Snapper, Btrfs and native Qt tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends snapper btrfs-progs \
            cmake ninja-build g++ pkg-config qt6-base-dev qt6-tools-dev \
            qt6-tools-dev-tools libbtrfsutil-dev python3
      - name: Compile GUI fixture against real native Snapper
        run: |
          cmake -S . -B build/snapper-native-qt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCARGO_EXECUTABLE=/usr/bin/true
          cmake --build build/snapper-native-qt --parallel 4 --target test-harbor-gui-user-smoke
      - name: Execute isolated real Snapper and Qt snapshot discovery
        run: |
          sudo env HARBOR_GUI_QA_SNAPPER_TEST="$GITHUB_WORKSPACE/build/snapper-native-qt/src/test-harbor-gui-user-smoke" \
            bash tests/qa_snapper_native_btrfs.sh

  cas-endurance:
    name: CAS multiclient 1000-cycle endurance and bounded memory
    runs-on: ubuntu-24.04
    needs: [rust]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: harbor-transport-static
          path: prebuilt
      - name: Run independent isolated local CAS rounds
        shell: bash
        run: |
          set -euo pipefail
          chmod 0755 prebuilt/harbor-transport
          file prebuilt/harbor-transport | grep -q ELF
          mkdir -p "$RUNNER_TEMP/harbor-endurance"
          for n in $(seq 1 10); do
            python3 tests/qa_cas_endurance.py \
              --binary "$GITHUB_WORKSPACE/prebuilt/harbor-transport" \
              --temp-root "$RUNNER_TEMP/harbor-endurance" \
              --rounds 100 \
              > "$RUNNER_TEMP/harbor-endurance/run-$n.json"
          done
          python3 - "$RUNNER_TEMP/harbor-endurance" <<'PY_ENDURANCE'
          import glob,json,sys
          reports=[json.load(open(f)) for f in glob.glob(sys.argv[1]+'/run-*.json')]
          assert len(reports)==10
          assert all(r['status']=='PASS' and r['rounds']==100 for r in reports)
          summary={'rounds':sum(r['rounds'] for r in reports),
                   'seconds':sum(r['seconds'] for r in reports),
                   'rss_kib_max':max(r['max_child_rss_kib'] for r in reports),
                   'cross_machine_reused':sum(r['total_reused_chunks'] for r in reports)}
          print('HARBOR_CAS_ENDURANCE_SUMMARY',json.dumps(summary))
          assert summary['rss_kib_max'] < 524288, 'More than 512 MiB child RSS'
          assert summary['cross_machine_reused'] > 1000
          PY_ENDURANCE
      - name: Concurrent independent clients and stale GC plan (fail closed)
        shell: bash
        run: |
          python3 tests/qa_cas_concurrent_clients.py \
            --binary "$GITHUB_WORKSPACE/prebuilt/harbor-transport" \
            --temp-root "$RUNNER_TEMP/harbor-endurance" \
            --workers 8 --archives-per-machine 12 \
            | tee "$RUNNER_TEMP/harbor-endurance/concurrent.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harbor-cas-1000-rounds-evidence
          path: ${{ runner.temp }}/harbor-endurance/*.json
          if-no-files-found: ignore
          retention-days: 14

  btrfs-qemu-tcg:
    name: Real Btrfs E2E on QEMU TCG
    runs-on: ubuntu-24.04
    needs: [rust]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: harbor-transport-static
          path: prebuilt
      - name: QEMU and ISO tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 p7zip-full python3-pexpect
      - name: Fetch pinned Alpine 3.23.3 ISO
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            --output "$RUNNER_TEMP/alpine.iso" \
            https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/x86_64/alpine-virt-3.23.3-x86_64.iso
          echo 'd91fb5c7a73528c89e0a1aa9a7d959f9deb9ca3dc5211e39bd73fd7df0d9070e  alpine.iso' | (cd "$RUNNER_TEMP" && sha256sum -c)
      - name: True Btrfs full, incremental and 3 repeated restorations
        run: |
          python3 tests/qa_btrfs_qemu_tcg.py \
            --binary "$GITHUB_WORKSPACE/prebuilt/harbor-transport" \
            --iso "$RUNNER_TEMP/alpine.iso" \
            --temp-root "$RUNNER_TEMP"
      - name: Two isolated Linux QEMU guests sharing one CAS
        run: |
          python3 tests/qa_multimachine_two_qemu.py \
            --binary "$GITHUB_WORKSPACE/prebuilt/harbor-transport" \
            --iso "$RUNNER_TEMP/alpine.iso" \
            --temp-root "$RUNNER_TEMP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: harbor-btrfs-qemu-qa-evidence
          path: |
            ${{ runner.temp }}/r30-alpine-kvm-perf-guest.log
            ${{ runner.temp }}/r30-*-*.json
            ${{ runner.temp }}/R45_results.json
            ${{ runner.temp }}/pegasus-qemu.log
            ${{ runner.temp }}/galactica-qemu.log
          if-no-files-found: ignore
          retention-days: 14

  detached-systemd-nfs-btrfs:
    name: Real NFS4 Btrfs + systemd survives actual Qt close
    runs-on: ubuntu-24.04
    needs: [rust]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Disposable Btrfs NFS4 systemd and Qt native prerequisites
        timeout-minutes: 12
        run: |
          # GitHub-hosted Azure mirrors sometimes stall at <100 KiB/s.
          # Change only this disposable runner to the official Ubuntu archive.
          for sources in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if test -f "$sources"; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$sources"
            fi
          done
          sudo timeout 120s apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=20
          sudo timeout 570s env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            nfs-ganesha nfs-ganesha-vfs nfs-common btrfs-progs snapper pv \
            cmake ninja-build g++ pkg-config qt6-base-dev qt6-tools-dev \
            qt6-tools-dev-tools libbtrfsutil-dev python3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: harbor-transport-static
          path: build/qa-btrfs
      - name: Build actual Qt test harness without production installation
        run: |
          cmake -S . -B build/qa-btrfs -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build/qa-btrfs --target test-harbor-gui-user-smoke --parallel 4
          chmod 0755 build/qa-btrfs/harbor-transport
          test -x build/qa-btrfs/harbor-transport
      - name: Click backup, destroy Qt window, finish real Btrfs over NFS4, verify and restore
        run: bash tests/qa_detached_systemd_btrfs_nfs.sh
