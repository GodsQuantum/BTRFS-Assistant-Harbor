name: 🐛 Report a bug
description: Help improve Harbor with a reproducible Linux issue.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please remove usernames, private host addresses, filesystem IDs and credentials from logs."
  - type: input
    id: distro
    attributes:
      label: Linux distribution and version
      placeholder: "CachyOS, Debian 13, Fedora 44"
    validations:
      required: true
  - type: input
    id: harbor
    attributes:
      label: Harbor version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened, and how can we reproduce it?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
